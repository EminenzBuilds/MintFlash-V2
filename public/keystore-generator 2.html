<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MintFlash Keystore Generator</title>
  <!--
    Self-host ethers next to this file:
      curl -o ethers.umd.min.js https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js
    Do not load a CDN on this page when encrypting real keys.
  -->
  <script src="./ethers.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; max-width: 480px; margin: 40px auto; padding: 20px; }
    p, label { color: #aaa; }
    input, button { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 10px; border: 1px solid #333; background: #1a1a1a; color: white; font-size: 1rem; box-sizing: border-box; }
    button { background: #f5a623; color: #000; font-weight: 600; border: none; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .warning { background: #2a1a00; border: 1px solid #f5a623; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; color: #ffd699; }
    #status { margin-top: 12px; color: #4ade80; }
  </style>
</head>
<body>
  <h1>MintFlash Keystore</h1>
  <p>Encrypts in this browser only. Nothing is uploaded.</p>
  <div class="warning">Never share the private key or password. Use a burner wallet.</div>
  <label>Private key</label>
  <input type="password" id="privateKey" placeholder="0x..." autocomplete="off" spellcheck="false" />
  <label>Password (12+ characters)</label>
  <input type="password" id="password" autocomplete="off" />
  <label>Confirm password</label>
  <input type="password" id="confirmPassword" autocomplete="off" />
  <button id="generateBtn" onclick="generateKeystore()">Generate keystore</button>
  <div id="status"></div>
  <script>
    const PRIVATE_KEY_PATTERN = /^0x[0-9a-fA-F]{64}$/;
    async function generateKeystore() {
      const privateKey = document.getElementById('privateKey').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('generateBtn');
      status.style.color = '#4ade80';
      status.textContent = '';
      if (typeof ethers === 'undefined') {
        status.style.color = '#f87171';
        status.textContent = 'ethers.umd.min.js missing on this server';
        return;
      }
      if (!PRIVATE_KEY_PATTERN.test(privateKey)) {
        status.style.color = '#f87171';
        status.textContent = 'Invalid private key';
        return;
      }
      if (password.length < 12) {
        status.style.color = '#f87171';
        status.textContent = 'Password must be at least 12 characters';
        return;
      }
      if (password !== confirmPassword) {
        status.style.color = '#f87171';
        status.textContent = 'Passwords do not match';
        return;
      }
      try {
        btn.disabled = true;
        btn.textContent = 'Encrypting...';
        const wallet = new ethers.Wallet(privateKey);
        const encryptedJson = await wallet.encrypt(password);
        const blob = new Blob([encryptedJson], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'keystore.json';
        a.click();
        URL.revokeObjectURL(url);
        status.textContent = 'Downloaded keystore.json';
        document.getElementById('privateKey').value = '';
        document.getElementById('password').value = '';
        document.getElementById('confirmPassword').value = '';
      } catch (err) {
        status.style.color = '#f87171';
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate keystore';
      }
    }
  </script>
</body>
</html>
